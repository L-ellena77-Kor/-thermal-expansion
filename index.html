<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>열팽창 이야기 — 12가지 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13202b;--panel:#1b2c3a;--line:#2e4457;--ink:#eef3f7;--dim:#9fb3c4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13202b}}
:root[data-theme="dark"]{--bg:#13202b}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{font-size:22px;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;color:var(--dim)}
.dot.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{font:inherit;font-size:clamp(17px,1.6vw,21px);font-weight:600;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:12px;padding:9px 18px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--dim)}
button:focus-visible,input:focus-visible{outline:3px solid #4fa8ff;outline-offset:3px}
main{max-width:1340px;margin:0 auto;padding:16px 24px 28px}
.ptitle{font-size:clamp(28px,3.3vw,46px);font-weight:700;margin:0;white-space:nowrap;letter-spacing:-0.02em}
.psub{font-size:clamp(17px,1.7vw,23px);color:var(--dim);margin:4px 0 14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);gap:24px;align-items:start}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px}
.stage svg{display:block;width:100%;height:auto}
.ctl{margin-bottom:16px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.lab,.ctl label{font-size:clamp(17px,1.6vw,22px);color:var(--dim);white-space:nowrap;display:block;margin-bottom:6px}
.ctl output{font-size:clamp(28px,3vw,44px);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:34px;accent-color:#a9b4bd;cursor:pointer}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;padding:10px 6px}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.ro{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.ro .k{font-size:clamp(15px,1.4vw,19px);color:var(--dim);white-space:nowrap}
.ro .v{font-size:clamp(32px,3.8vw,54px);font-weight:700;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.msgbox{border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.msg{font-size:clamp(22px,2.3vw,32px);font-weight:700;white-space:nowrap}
.why{font-size:clamp(16px,1.5vw,20px);color:var(--dim);white-space:nowrap;margin-top:4px;min-height:1.3em}
.btns{display:flex;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.note{font-size:clamp(14px,1.2vw,16px);color:var(--dim);margin-top:14px;white-space:nowrap}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.ptitle,.psub,.msg,.why,.note,.brand{white-space:normal}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <div class="brand">열팽창 이야기</div>
  <div class="dots" id="dots"></div>
  <button id="fs">전체화면</button>
  <button id="prev" aria-label="이전 쪽">이전</button>
  <button id="next" aria-label="다음 쪽">다음</button>
</header>
<main>
  <h1 class="ptitle" id="title"></h1>
  <p class="psub" id="sub"></p>
  <div class="grid">
    <div class="stage"><svg id="svg" viewBox="0 0 800 560" role="img"></svg></div>
    <div><div id="panel"></div><p class="note" id="note"></p><p class="note">Copyright 2026 오효선</p></div>
  </div>
</main>
<script>
(function(){
var C={hot:'#ff5a45',cold:'#4fa8ff',steel:'#a9b4bd',ink:'#eef3f7',dim:'#9fb3c4',line:'#2e4457',panel:'#1b2c3a',ok:'#5fd39a',warn:'#ffc04d',wire:'#6f8597'};
function $(id){return document.getElementById(id)}
function hx(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));var A=hx(a),B=hx(b);return 'rgb('+A.map(function(v,i){return Math.round(v+(B[i]-v)*t)}).join(',')+')'}
function tcol(T,ref,span){var t=(T-ref)/span;return t>=0?mix(C.steel,C.hot,t):mix(C.steel,C.cold,-t)}
function P(pts){return 'M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L')}
function tx(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" fill="'+(o.fill||C.dim)+'" font-size="'+(o.size||20)+'" text-anchor="'+(o.anchor||'start')+'" font-weight="'+(o.w||400)+'">'+s+'</text>'}
function sgn(v,d){return (v>0?'+':'')+v.toFixed(d)}
var audio=null;
function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function tone(f,dur,type,vol){try{var a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||0.2,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0005,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}catch(e){}}
function pluck(f){[1,2,3].forEach(function(h,i){tone(f*h,1.8-i*0.4,'sine',[0.3,0.1,0.05][i])})}

var uid=0;
function div(c){var d=document.createElement('div');d.className=c;return d}
var UI={
 slider:function(p,label,min,max,step,val,fmt,on){var d=div('ctl'),id='s'+(uid++);d.innerHTML='<div class="row"><label for="'+id+'"></label><output></output></div><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'">';d.querySelector('label').textContent=label;p.appendChild(d);var inp=d.querySelector('input'),out=d.querySelector('output');function u(){out.textContent=fmt(+inp.value)}inp.addEventListener('input',function(){u();on(+inp.value)});u();return{get v(){return +inp.value},set:function(v){inp.value=v;u()}}},
 seg:function(p,label,opts,val,on){var d=div('ctl');if(label){var l=div('lab');l.textContent=label;d.appendChild(l)}var box=div('seg');d.appendChild(box);var v=val;var bs=opts.map(function(o,i){var b=document.createElement('button');b.textContent=o;b.onclick=function(){v=i;paint();on(i)};box.appendChild(b);return b});function paint(){bs.forEach(function(b,i){b.classList.toggle('on',i===v)})}paint();p.appendChild(d);return{get v(){return v}}},
 ro:function(p,label){var d=div('ro');d.innerHTML='<div class="k"></div><div class="v"></div>';p.appendChild(d);var k=d.firstChild,v=d.lastChild;k.textContent=label;return{set:function(t,c){v.textContent=t;v.style.color=c||''},label:function(t){k.textContent=t}}},
 msg:function(p){var d=div('msgbox');d.innerHTML='<div class="msg"></div><div class="why"></div>';p.appendChild(d);return{set:function(t,c,w){d.firstChild.textContent=t;d.firstChild.style.color=c||'';d.lastChild.textContent=w||''}}},
 btns:function(p,list){var d=div('btns');var out=list.map(function(x){var b=document.createElement('button');b.textContent=x[0];b.onclick=x[1];d.appendChild(b);return b});p.appendChild(d);return out}
};
var timers=[];
function every(ms,fn){timers.push(setInterval(fn,ms))}

var pages=[];

/* 1. Eiffel */
pages.push({title:'1. 에펠탑은 여름에 더 높아질까?',sub:'철로 만든 약 300 m 탑은 온도에 따라 키가 변해요',note:'왼쪽 탑의 변화는 크게 과장 · 오른쪽 자는 실제 cm 눈금',
init:function(svg,p){
 var s=UI.slider(p,'철의 온도',-10,45,1,15,function(v){return v+'°C'},draw);
 UI.btns(p,[['겨울 -10°C',function(){s.set(-10);draw()}],['봄·가을 15°C',function(){s.set(15);draw()}],['여름 햇볕 45°C',function(){s.set(45);draw()}]]);
 var r=UI.ro(p,'높이 변화  ΔL = α × L × ΔT'),r2=UI.ro(p,'탑의 높이 (15°C에서 300 m)'),m=UI.msg(p);
 function draw(){
  var T=s.v,dT=T-15,dh=1.2e-5*300*dT,col=tcol(T,15,30);
  var base=520,H0=430,H=H0*(1+0.004*dT),cx=250;
  var prof=[[0,150],[0.05,130],[0.17,94],[0.25,74],[0.38,46],[0.55,30],[0.75,17],[0.9,9],[1,3]];
  var L=prof.map(function(q){return [cx-q[1],base-q[0]*H]}),R=prof.slice().reverse().map(function(q){return [cx+q[1],base-q[0]*H]});
  var g='<defs><pattern id="lat" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0 L14 14 M14 0 L0 14" stroke="'+col+'" stroke-width="1.6" opacity=".7"/></pattern></defs>';
  g+='<line x1="40" y1="'+base+'" x2="480" y2="'+base+'" stroke="'+C.line+'" stroke-width="3"/>';
  g+='<path d="'+P(L.concat(R))+' Z" fill="url(#lat)" stroke="'+col+'" stroke-width="4" stroke-linejoin="round"/>';
  g+='<path d="M'+(cx-122)+' '+base+' Q'+cx+' '+(base-0.22*H)+' '+(cx+122)+' '+base+' Z" fill="'+C.panel+'" stroke="'+col+'" stroke-width="4"/>';
  [[0.17,94],[0.38,46],[0.9,9]].forEach(function(q){g+='<rect x="'+(cx-q[1]-12)+'" y="'+(base-q[0]*H-7)+'" width="'+(2*q[1]+24)+'" height="13" rx="2" fill="'+col+'"/>'});
  g+='<line x1="'+cx+'" y1="'+(base-H)+'" x2="'+cx+'" y2="'+(base-H-24)+'" stroke="'+col+'" stroke-width="4"/>';
  g+='<line x1="40" y1="'+(base-H0)+'" x2="470" y2="'+(base-H0)+'" stroke="'+C.wire+'" stroke-width="2" stroke-dasharray="8 8"/>';
  g+=tx(300,base-H0-10,'15°C 때 꼭대기',{size:18});
  g+='<rect x="530" y="30" width="245" height="500" rx="14" fill="none" stroke="'+C.line+'" stroke-width="2"/>';
  g+=tx(652,66,'꼭대기 확대',{anchor:'middle',size:22,fill:C.ink});
  for(var c=-15;c<=15;c++){var y=300-c*12,big=c%5===0;g+='<line x1="590" y1="'+y+'" x2="'+(big?620:606)+'" y2="'+y+'" stroke="'+C.dim+'" stroke-width="'+(big?2.5:1.5)+'"/>';if(big)g+=tx(582,y+7,(c>0?'+':'')+c,{anchor:'end',size:19})}
  g+=tx(560,512,'단위: cm',{size:17});
  var my=300-dh*100*12;
  g+='<line x1="620" y1="'+my+'" x2="700" y2="'+my+'" stroke="'+col+'" stroke-width="3" stroke-dasharray="6 5"/>';
  g+='<polygon points="700,'+my+' 686,'+(my+70)+' 714,'+(my+70)+'" fill="'+col+'"/>';
  svg.innerHTML=g;
  r.set(sgn(dh*100,1)+' cm',col);r2.set((300+dh).toFixed(3)+' m');
  m.set(dT>0?'늘어나서 더 높아져요':dT<0?'줄어들어서 낮아져요':'기준 높이',col,dT>0?'여름 한낮엔 약 10 cm 이상 키가 커요':dT<0?'겨울엔 기준보다 키가 작아져요':'온도를 바꿔 보세요');
 }
 draw();
}});

/* 2. Rail and bridge */
pages.push({title:'2. 철로와 다리에 틈을 두는 이유',sub:'여름엔 틈이 좁아지고, 틈이 없으면 휘거나 끊어져요',note:'그림의 변형은 과장 · 요즘 고속철도는 레일을 용접해 강하게 고정해요(장대레일)',
init:function(svg,p){
 var kind=UI.seg(p,'무엇을 볼까요?',['철로','다리'],0,draw);
 var gap=UI.seg(p,'이음새',['틈 있음','틈 없음'],0,draw);
 var s=UI.slider(p,'온도',-20,60,1,15,function(v){return v+'°C'},draw);
 var r=UI.ro(p,''),m=UI.msg(p);
 function draw(){
  var T=s.v,dT=T-15,col=tcol(T,15,35),rail=kind.v===0,has=gap.v===0,g='',gmm,A=0,brk=0;
  if(!has){if(T>30)A=Math.min(rail?80:45,(T-30)*(rail?2.6:1.6));if(T<0)brk=Math.min(34,(-T)*1.6+6)}
  if(rail){
   gmm=12-0.3*dT;var gv=Math.max(0,gmm)*2.2;
   var off=function(x){return (x>200&&x<600)?A*Math.sin(Math.PI*(x-200)/400):0};
   g+=tx(30,60,'위에서 본 철로',{size:22,fill:C.ink});
   g+='<rect x="20" y="150" width="760" height="250" rx="10" fill="#22303b"/>';
   for(var x=50;x<=750;x+=40)g+='<rect x="'+(x-9)+'" y="'+(165+off(x))+'" width="18" height="220" rx="3" fill="#6b5641"/>';
   [215,335].forEach(function(y,i){
    if(has){[[20,280-gv/2],[280+gv/2,520-gv/2],[520+gv/2,780]].forEach(function(q){g+='<rect x="'+q[0]+'" y="'+(y-8)+'" width="'+(q[1]-q[0])+'" height="16" rx="2" fill="'+col+'"/>'})}
    else if(brk>0){var bx=400+i*30;g+='<rect x="20" y="'+(y-8)+'" width="'+(bx-brk/2-20)+'" height="16" fill="'+col+'"/><rect x="'+(bx+brk/2)+'" y="'+(y-8)+'" width="'+(780-bx-brk/2)+'" height="16" fill="'+col+'"/>';
     g+='<path d="M'+(bx-brk/2)+' '+(y-8)+' l6 5 l-6 5 l6 6" stroke="'+C.hot+'" stroke-width="3" fill="none"/><path d="M'+(bx+brk/2)+' '+(y-8)+' l-6 5 l6 5 l-6 6" stroke="'+C.hot+'" stroke-width="3" fill="none"/>'}
    else{var pts=[];for(var x2=20;x2<=780;x2+=10)pts.push([x2,y+off(x2)]);g+='<path d="'+P(pts)+'" stroke="'+col+'" stroke-width="16" fill="none"/>'}
   });
   if(has)[280,520].forEach(function(x){g+=tx(x,138,gmm>0?gmm.toFixed(1)+' mm':'맞닿음',{anchor:'middle',size:22,fill:gmm>0?C.ink:C.hot,w:600})});
   if(A>0)g+=tx(400,460,'휘어짐!',{anchor:'middle',size:30,fill:C.hot,w:700});
   if(brk>0)g+=tx(415,460,'끊어짐!',{anchor:'middle',size:30,fill:C.cold,w:700});
  }else{
   gmm=30-0.6*dT;var gv2=Math.max(0,gmm)*1.2;
   g+=tx(30,60,'옆에서 본 다리',{size:22,fill:C.ink});
   g+='<rect x="20" y="470" width="760" height="70" fill="#1d3850"/>';
   g+='<polygon points="20,290 120,290 145,540 20,540" fill="#4a5866"/><polygon points="680,290 780,290 780,540 655,540" fill="#4a5866"/><rect x="380" y="290" width="40" height="250" fill="#4a5866"/>';
   if(has){g+='<rect x="20" y="250" width="'+(380-gv2/2)+'" height="36" fill="'+col+'"/><rect x="'+(400+gv2/2)+'" y="250" width="'+(380-gv2/2)+'" height="36" fill="'+col+'"/>';
    g+=tx(400,225,gmm>0?gmm.toFixed(1)+' mm':'맞닿음',{anchor:'middle',size:22,fill:gmm>0?C.ink:C.hot,w:600});
    g+='<path d="M60 250 L60 236 M740 250 L740 236" stroke="'+C.dim+'" stroke-width="2"/>'+tx(150,325,'고정',{size:18})+tx(650,325,'고정',{size:18,anchor:'end'});}
   else{var off2=function(x){return (x>250&&x<550)?-A*Math.sin(Math.PI*(x-250)/300):0};var top=[],bot=[];for(var x3=20;x3<=780;x3+=10){top.push([x3,250+off2(x3)]);bot.unshift([x3,286+off2(x3)])}
    g+='<path d="'+P(top.concat(bot))+' Z" fill="'+col+'"/>';
    if(brk>0){var w=brk*0.8;g+='<polygon points="'+(400-w/2)+',250 '+(400+w/2)+',250 403,'+(250+Math.min(36,brk+4))+'" fill="'+C.panel+'" stroke="'+C.cold+'" stroke-width="2"/>';g+=tx(400,215,'금이 가요!',{anchor:'middle',size:30,fill:C.cold,w:700})}
    if(A>0)g+=tx(400,150,'솟아올라요!',{anchor:'middle',size:30,fill:C.hot,w:700});}
  }
  svg.innerHTML=g;
  if(has){r.label(rail?'레일 사이 틈 (25 m 레일)':'다리 이음새 틈 (50 m 구간)');r.set(gmm>0?gmm.toFixed(1)+' mm':'0 mm',col);
   m.set(gmm<=0?'틈이 다 닫혔어요':dT>0?'늘어나서 틈이 좁아져요':dT<0?'줄어들어서 틈이 넓어져요':'설치할 때 모습',gmm<=0?C.hot:col,dT>0?'늘어날 자리를 미리 비워 둔 거예요':dT<0?'겨울엔 틈이 넓어져 덜컹 소리가 커져요':'온도를 바꿔 보세요');}
  else{r.label(rail?(dT>=0?'레일이 미는 힘':'레일이 당기는 힘'):(dT>=0?'다리가 미는 힘':'다리가 당기는 힘'));
   r.set(rail?'약 '+Math.round(1.98*Math.abs(dT))+'톤':(Math.abs(dT)<5?'작음':'아주 큼'),col);
   m.set(A>0?(rail?'밀 곳이 없어 휘어요':'밀 곳이 없어 솟아요'):brk>0?(rail?'당기는 힘에 끊어져요':'당기는 힘에 금이 가요'):dT>0?'미는 힘이 쌓이는 중':dT<0?'당기는 힘이 쌓이는 중':'틈 없이 이어진 모습',A>0?C.hot:brk>0?C.cold:col,A>0||brk>0?'틈이 없으면 늘고 줄 자리가 없어요':'온도를 더 바꿔 보세요');}
 }
 draw();
}});

/* 3. Gas pipe */
pages.push({title:'3. 가스관을 ㄷ자로 만드는 이유',sub:'위·아래가 고정된 관의 늘어남을 ㄷ자가 휘며 받아내요',note:'그림의 변형은 과장 · 송유관, 공장 배관도 같은 원리예요',
init:function(svg,p){
 var shp=UI.seg(p,'관 모양',['ㄷ자 있음','곧은 관'],0,draw);
 var s=UI.slider(p,'관 온도',-20,60,1,20,function(v){return v+'°C'},draw);
 var ln=UI.slider(p,'고정점 사이 길이',10,60,1,30,function(v){return v+' m'},draw);
 var r=UI.ro(p,'길이 변화  ΔL = α × L × ΔT'),m=UI.msg(p);
 var X0=165,X1=420,Y0=52,Y1=508,YA=200,YB=360;
 function arm(yb,d,sg){var a=[];for(var i=0;i<=24;i++){var u=i/24,f=1-(3*u*u-2*u*u*u);a.push([X0+(X1-X0)*u,yb+sg*d*f])}return a}
 function loop(d){var t=arm(YA,d,1),b=arm(YB,d,-1).reverse();return P([[X0,Y0]].concat(t,[[X1,YA],[X1,YB]],b,[[X0,Y1]]))}
 function arrow(x,y,dir,c){var h=dir*44;return '<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y+h)+'" stroke="'+c+'" stroke-width="5"/><path d="M'+(x-11)+' '+(y+h-dir*14)+' L'+x+' '+(y+h)+' L'+(x+11)+' '+(y+h-dir*14)+'" fill="none" stroke="'+c+'" stroke-width="5"/>'}

  for(var r3=0;r3<H;r3++){var sc=1+e*(rm[r3]-20);for(var c=0;c<W;c++){if(!isG(c,r3))continue;var x=X0+c*CS,xc=400+(x-400)*sc;g+='<rect x="'+xc.toFixed(1)+'" y="'+(Y0+r3*CS)+'" width="'+(CS*sc+0.6).toFixed(1)+'" height="'+(CS+0.6)+'" fill="'+heatCol(TT[r3][c])+'"/>'}}
  if(crack){var cy=Y0+(crack.r+1)*CS,sl=1+e*(rm[crack.r]-20),xl=400-(400-X0)*sl;
   g+='<path d="M'+(xl-4)+' '+(cy-6)+' l18 8 l10 -10 l14 12 l12 -6 l16 14 l20 4 l14 16" stroke="#eef3f7" stroke-width="4" fill="none"/>';
   g+='<path d="M'+(400+(400-X0)*sl+4)+' '+(cy+4)+' l-16 -10 l-12 12 l-18 -8 l-10 16" stroke="#eef3f7" stroke-width="4" fill="none"/>';
   g+=tx(400,50,'쩍! 금이 갔어요',{anchor:'middle',size:32,fill:C.hot,w:700})}
  g+=tx(40,520,'차가움',{size:18})+'<rect x="110" y="506" width="160" height="16" rx="4" fill="url(#hg)"/>'+tx(282,520,'뜨거움',{size:18});
  g='<defs><linearGradient id="hg"><stop offset="0" stop-color="#5a6b7a"/><stop offset=".5" stop-color="#ffc04d"/><stop offset="1" stop-color="#ff5a45"/></linearGradient></defs>'+g;
  svg.innerHTML=g;
  rd.set(Math.round(diff)+'°C',diff>30?C.hot:'');
  if(crack)m.set('어긋나서 금이 갔어요',C.hot,'뜨거운 벽은 늘고 두꺼운 바닥은 그대로예요');
  else if(!poured)m.set('물을 부어 보세요',C.steel,'처음엔 컵 전체가 20°C예요');
  else if(diff>8)m.set('물 닿은 곳만 먼저 늘어나요',C.warn,gt.v===0?'열이 바닥까지 가는 데 시간이 걸려요':'내열 유리는 조금만 늘어나 버텨요');
  else m.set('온도가 고르게 퍼졌어요',C.ok,'이제는 위아래가 함께 늘어났어요');
 }
 every(50,function(){if(poured){if(fill>4)fill--;step()}draw()});
 draw();
}});

var cur=0,dots=$('dots');
pages.forEach(function(pg,i){var b=document.createElement('button');b.className='dot';b.textContent=i+1;b.setAttribute('aria-label',(i+1)+'쪽');b.onclick=function(){show(i)};dots.appendChild(b)});
function show(i){
 timers.forEach(clearInterval);timers=[];cur=(i+pages.length)%pages.length;var pg=pages[cur];
 $('title').textContent=pg.title;$('sub').textContent=pg.sub;$('note').textContent=pg.note||'';
 $('svg').setAttribute('aria-label',pg.title);$('svg').innerHTML='';$('panel').innerHTML='';
 Array.prototype.forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===cur)});
 pg.init($('svg'),$('panel'));window.scrollTo(0,0);
}
$('prev').onclick=function(){show(cur-1)};$('next').onclick=function(){show(cur+1)};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='PageDown')show(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1)});
var fsb=$('fs');
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
fsb.onclick=function(){var de=document.documentElement;if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}};
function fsLabel(){fsb.textContent=fsEl()?'전체화면 끄기':'전체화면'}
document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);
show(0);
})();
